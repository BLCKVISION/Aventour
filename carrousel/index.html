<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D PNG Carousel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">
  <div class="a3d" style="--n: 18">
    <img class="card" src="png/1.webp"  style="--i:0">
    <img class="card" src="png/2.webp"  style="--i:1">
    <img class="card" src="png/3.webp"  style="--i:2">
    <img class="card" src="png/4.webp"  style="--i:3">
    <img class="card" src="png/5.webp"  style="--i:4">
    <img class="card" src="png/6.webp"  style="--i:5">
    <img class="card" src="png/7.webp"  style="--i:6">
    <img class="card" src="png/8.webp"  style="--i:7">
    <img class="card" src="png/9.webp"  style="--i:8">
    <img class="card" src="png/10.webp" style="--i:9">
    <img class="card" src="png/11.webp" style="--i:10">
    <img class="card" src="png/12.webp" style="--i:11">
    
    <!-- Repetimos algunas para formar el círculo de 18 y suavizar la curva -->
    <img class="card" src="png/1.webp"  style="--i:12">
    <img class="card" src="png/2.webp"  style="--i:13">
    <img class="card" src="png/3.webp"  style="--i:14">
    <img class="card" src="png/4.webp"  style="--i:15">
    <img class="card" src="png/5.webp"  style="--i:16">
    <img class="card" src="png/6.webp"  style="--i:17">

  </div>
</div>

</body>
</html>
